# Copy this file to .chronicle/config.toml and adjust it for the deployment.

[database]
jester = "sqlite://data/jester.sqlite3"
chronicle = "sqlite://data/chronicle.sqlite3"

[chronicle]
corpus_dir = "corpus"

# The first `/chronicle start` downloads these files into the Hugging Face cache.
llm_repo = "Qwen/Qwen2.5-7B-Instruct-GGUF"
llm_revision = "main"
llm_model_file = "qwen2.5-7b-instruct-q3_k_m.gguf"
llm_tokenizer_repo = "Qwen/Qwen2.5-7B-Instruct"
llm_tokenizer_file = "tokenizer.json"

# Must be between 1 and 32768.
llm_max_tokens = 512

# Total model context budget, including prompt and generated tokens.
# Must be greater than llm_max_tokens and no greater than 32768.
llm_context_limit = 32768

# Must be finite and between 0.0 and 2.0.
llm_temperature = 0.2

# Seed used by the native Candle sampler.
llm_seed = 42

# Instructions applied in the system turn before each Chronicle question.
llm_system_prompt = """\
    You are Chronicle, a concise and thoughtful assistant.\
    Answer only from the supplied Chronicle context.\
    If the context is insufficient, say so plainly.\
    Do not invent facts.\
"""

# Maximum number of Unicode characters in a generated Discord reply.
llm_max_reply_length = 1900

# Must be between 1 and 100. Larger values increase prompt size and latency.
retrieval_limit = 5

# Number of vector candidates to inspect before applying the distance threshold.
# Must be at least retrieval_limit and no greater than 1000.
retrieval_candidate_limit = 15

# Maximum vector distance accepted as relevant context. Lower values are stricter.
retrieval_distance_threshold = 0.8

# Jaccard overlap threshold for suppressing near-duplicate word-pair shingles.
# Must be between 0.0 and 1.0; higher values require more overlap.
retrieval_near_duplicate_threshold = 0.85

# Maximum accepted chunks from any one document.
retrieval_max_chunks_per_document = 2

# Maximum number of BGE embedding tokens per chunk, including special tokens.
# Must be between 3 and 512.
max_chunk_tokens = 480
# Target number of content tokens shared by adjacent chunks. Special model
# tokens are excluded. Section boundaries may reduce the effective overlap.
# Zero disables overlap.
# A 10–20% experiment for this budget would be 48–96 tokens.
chunk_overlap_tokens = 0

# Optional: map Discord users to names used in transcripts.
# Replace the example IDs with real Discord user IDs.
#
# [alias_groups.main]
# name = "Main names"
#
# [alias_groups.main.aliases]
# "123456789012345678" = "Alice"
# "234567890123456789" = "Bob"
#
# Optional: make an alias group available to a guild.
# Replace the example ID with a real Discord server ID.
#
# [guilds."345678901234567890"]
# alias_groups = ["main"]
