# Copy this file to .chronicle/config.toml and adjust it for the deployment.

[database]
jester = "sqlite://data/jester.sqlite3"
chronicle = "sqlite://data/chronicle.sqlite3"

[chronicle]
corpus_dir = "corpus"

# The first `/chronicle start` downloads these files into the Hugging Face cache.
llm_repo = "Qwen/Qwen2.5-7B-Instruct-GGUF"
llm_revision = "main"
llm_model_file = "qwen2.5-7b-instruct-q3_k_m.gguf"
llm_tokenizer_repo = "Qwen/Qwen2.5-7B-Instruct"
llm_tokenizer_file = "tokenizer.json"

# Must be between 1 and 32768.
llm_max_tokens = 512

# Must be finite and between 0.0 and 2.0.
llm_temperature = 0.2

# Seed used by the native Candle sampler.
llm_seed = 42

# Instructions applied in the system turn before each Chronicle question.
llm_system_prompt = """\
    You are Chronicle, a concise and thoughtful assistant.\
    Answer only from the supplied Chronicle context.\
    If the context is insufficient, say so plainly.\
    Do not invent facts.\
"""

# Must be between 1 and 100. Larger values increase prompt size and latency.
retrieval_limit = 5

# Must be greater than zero. This is a character/byte-oriented chunk limit;
# the embedding tokenizer still truncates each chunk at 512 tokens.
max_chunk_length = 2000

# Optional: map Discord users to names used in transcripts.
# Replace the example IDs with real Discord user IDs.
#
# [alias_groups.main]
# name = "Main names"
#
# [alias_groups.main.aliases]
# "123456789012345678" = "Alice"
# "234567890123456789" = "Bob"
#
# Optional: make an alias group available to a guild.
# Replace the example ID with a real Discord server ID.
#
# [guilds."345678901234567890"]
# alias_groups = ["main"]
