name = "Chronicle structured query MVP v1"
minimum_planner_accuracy = 0.95

[[cases]]
id = "all-characters"
question = "How many characters are recorded?"
expected_total = 10
[cases.plan]
operation = "count"
note_type = "character"
[cases.plan.filters]

