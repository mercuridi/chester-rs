name = "Chronicle fixed retrieval baseline v1"
max_chunk_tokens = 160
chunk_overlap_tokens = 0
minimum_hybrid_recall = 0.8

[retrieval]
limit = 3
candidate_limit = 12
distance_threshold = 0.8
near_duplicate_threshold = 0.85
max_chunks_per_document = 2

[[cases]]
id = "exact"
category = "exact-name"
question = "Where is Moonspire?"
relevant_notes = ["moonspire", "vey"]
evidence = ["northern shore"]

[[cases]]
id = "alias"
category = "alias"
question = "Where is the Silver Beacon?"
relevant_notes = ["moonspire"]
evidence = ["northern shore"]

