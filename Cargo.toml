[package]
name = "chester-rs"
version = "1.0.0"
edition = "2024"
publish = false

[patch.crates-io]
candle-kernels = { path = "../candle/candle-kernels" }

[dependencies]
dotenv = "0.15.0"
futures = "0.3.31"
reqwest = "0.12.23"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-native-tls"] }
symphonia = { version = "0.5.4", features = ["mp3"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
rand = "0.9"
async-trait = "0.1"
serenity-voice-model = "0.3.0"
hound = "3.5.1"
tokio = { version = "1.47.1", features = ["full", "rt-multi-thread"] }
opus = "0.3.1"
ogg = "0.9.2"
rtrb = "0.4.0"
chrono = "0.4.45"
rubato = "0.16.2"
candle-core = { version = "0.11", features = ["cuda"] }
candle-nn = "0.11"
candle-transformers = { version = "0.11", features = ["cuda"] }
hf-hub = "0.5"
tokenizers = "0.22"
sha2 = "0.11.0"
hex = "0.4.3"
toml = "1.1.4"
anyhow = "1.0.99"
serenity = { version = "0.12.5", features = ["cache", "framework", "standard_framework", "voice"] }
songbird = { version = "0.6.0", features = ["serenity", "receive"] }
poise = "0.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
titlecase = "3.6.0"
serde_yaml = "0.9.34"
